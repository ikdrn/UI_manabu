<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI学ぶ — フロントエンドUI・コード学習リファレンス</title>
  <link rel="stylesheet" href="shared/variables.css">
  <link rel="stylesheet" href="shared/reset.css">
  <style>
    /* ===================================================================
       index.html 専用スタイル — 目次ページ
       =================================================================== */

    .page {
      max-width: var(--content-width-wide);
      margin: 0 auto;
      padding: var(--space-8) var(--space-4);
    }

    /* --- ヒーローセクション --- */
    .hero {
      text-align: center;
      padding: var(--space-16) 0 var(--space-12);
    }

    .hero-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: var(--font-bold);
      color: var(--color-neutral-900);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .hero-title span {
      color: var(--color-brand-500);
    }

    .hero-subtitle {
      font-size: var(--text-lg);
      color: var(--color-neutral-500);
      margin-top: var(--space-4);
      max-width: 560px;
      margin-inline: auto;
      line-height: var(--leading-relaxed);
    }

    /* --- 検索 --- */
    .search-wrapper {
      max-width: 480px;
      margin: var(--space-8) auto var(--space-12);
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: var(--space-4);
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--color-neutral-400);
    }

    .search-input {
      width: 100%;
      padding: var(--space-3) var(--space-4) var(--space-3) var(--space-12);
      font-size: var(--text-base);
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius-full);
      background: var(--color-surface-raised);
      transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
    }

    .search-input::placeholder {
      color: var(--color-neutral-400);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--color-brand-400);
      box-shadow: 0 0 0 3px var(--color-brand-100);
    }

    /* --- カテゴリグリッド --- */
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-6);
    }

    .category-card {
      background: var(--color-surface-raised);
      border: 1px solid var(--color-neutral-200);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      transition: box-shadow var(--duration-normal) var(--ease-out),
                  border-color var(--duration-normal);
    }

    .category-card:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--color-neutral-300);
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-2);
    }

    .category-name {
      font-size: var(--text-xl);
      font-weight: var(--font-semibold);
      color: var(--color-neutral-900);
    }

    .category-count {
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      color: var(--color-neutral-500);
      background: var(--color-neutral-100);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-full);
    }

    .category-desc {
      font-size: var(--text-sm);
      color: var(--color-neutral-500);
      margin-bottom: var(--space-4);
    }

    .component-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--color-neutral-100);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .component-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface-raised);
      color: var(--color-neutral-700);
      text-decoration: none;
      font-size: var(--text-sm);
      transition: background var(--duration-fast);
    }

    .component-link:hover {
      background: var(--color-brand-50);
      color: var(--color-brand-700);
      text-decoration: none;
    }

    .component-link-arrow {
      color: var(--color-neutral-300);
      transition: color var(--duration-fast), transform var(--duration-fast);
      flex-shrink: 0;
    }

    .component-link:hover .component-link-arrow {
      color: var(--color-brand-500);
      transform: translateX(2px);
    }

    .component-concepts {
      display: flex;
      gap: var(--space-1);
      flex-wrap: wrap;
      flex: 1;
      margin-left: var(--space-3);
      justify-content: flex-end;
    }

    .concept-tag {
      font-size: 10px;
      color: var(--color-neutral-400);
      background: var(--color-neutral-50);
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    .component-link:hover .concept-tag {
      background: var(--color-brand-100);
      color: var(--color-brand-600);
    }

    /* --- フッター --- */
    .footer {
      text-align: center;
      padding: var(--space-12) 0 var(--space-8);
      color: var(--color-neutral-400);
      font-size: var(--text-sm);
    }

    /* --- 検索フィルタ中に非表示にするクラス --- */
    .hidden {
      display: none !important;
    }

    /* --- レスポンシブ --- */
    @media (max-width: 640px) {
      .hero {
        padding: var(--space-8) 0 var(--space-6);
      }

      .categories {
        grid-template-columns: 1fr;
      }

      .component-concepts {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- ヒーロー -->
    <header class="hero">
      <h1 class="hero-title">UI<span>学ぶ</span></h1>
      <p class="hero-subtitle">
        55のUIコンポーネントを動くプレビューとコード解説で学ぶ、フロントエンド実践リファレンス
      </p>
    </header>

    <!-- 検索 -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="search"
        class="search-input"
        placeholder="コンポーネントを検索..."
        id="searchInput"
        aria-label="コンポーネントを検索"
      >
    </div>

    <!-- カテゴリ一覧 -->
    <main class="categories" id="categories">
      <!-- JSで動的に生成 -->
    </main>

    <footer class="footer">
      <p>Vanilla HTML / CSS / JS のみで構築 — 外部ライブラリ不使用</p>
    </footer>
  </div>

  <script src="shared/navigation.js"></script>
  <script>
    (function () {
      'use strict';

      var container = document.getElementById('categories');
      var searchInput = document.getElementById('searchInput');

      /* --- カテゴリカードを生成 --- */
      function renderCategories() {
        var html = '';
        COMPONENT_MANIFEST.forEach(function (cat) {
          html += '<section class="category-card" id="' + cat.slug + '" data-category="' + cat.category + '">';
          html += '<div class="category-header">';
          html += '<h2 class="category-name">' + cat.category + '</h2>';
          html += '<span class="category-count">' + cat.items.length + '種</span>';
          html += '</div>';
          html += '<p class="category-desc">' + cat.description + '</p>';
          html += '<div class="component-list">';

          cat.items.forEach(function (item) {
            html += '<a href="components/' + cat.slug + '/' + item.file + '" class="component-link" data-name="' + item.name + '" data-concepts="' + item.concepts.join(' ') + '">';
            html += '<span>' + item.name + '</span>';
            html += '<span class="component-concepts">';
            item.concepts.forEach(function (c) {
              html += '<span class="concept-tag">' + c + '</span>';
            });
            html += '</span>';
            html += '<svg class="component-link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>';
            html += '</a>';
          });

          html += '</div>';
          html += '</section>';
        });
        container.innerHTML = html;
      }

      /* --- 検索フィルタ --- */
      function filterComponents() {
        var query = searchInput.value.toLowerCase().trim();
        var cards = container.querySelectorAll('.category-card');

        cards.forEach(function (card) {
          var links = card.querySelectorAll('.component-link');
          var hasVisible = false;

          links.forEach(function (link) {
            var name = (link.getAttribute('data-name') || '').toLowerCase();
            var concepts = (link.getAttribute('data-concepts') || '').toLowerCase();
            var catName = (card.getAttribute('data-category') || '').toLowerCase();

            var match = !query || name.indexOf(query) !== -1 || concepts.indexOf(query) !== -1 || catName.indexOf(query) !== -1;

            link.classList.toggle('hidden', !match);
            if (match) hasVisible = true;
          });

          card.classList.toggle('hidden', !hasVisible);
        });
      }

      searchInput.addEventListener('input', filterComponents);

      renderCategories();
    })();
  </script>
</body>
</html>
